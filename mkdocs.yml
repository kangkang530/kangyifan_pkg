site_name: 乘用车上车体总布置知识库
site_url: https://kangkang530.github.io/kangyifan_pkg/
site_description: >-
  面向汽车设计与总布置方向在校学生、初级工程师及自学者的系统性知识库，
  涵盖上车体总布置基础、整车参数、IP&CNSL、门板立柱顶棚、前后端区域、
  人机舒适性、整车断面与整车开发流程。
site_author: 个人知识库

repo_url: https://github.com/kangkang530/kangyifan_pkg
repo_name: kangkang530/kangyifan_pkg
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# 排除 Office 临时锁文件（~$ 开头），避免 PPT 打开时构建报权限错误
exclude_docs: |
  ~$*

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    logo: material/car
    repo: fontawesome/brands/github
  favicon: assets/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kangkang530/kangyifan_pkg
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/benchmark.css
  - stylesheets/auth.css

extra_javascript:
  - javascripts/benchmark.js
  - javascripts/auth.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - zh
        - en
  # 如需显示文章更新日期，安装 Git 后可启用以下插件：
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: date
  #     fallback_to_build_date: true

nav:
  - 首页: index.md
  - 上车体总布置基础:
    - 概述: basics/overview.md
    - 工作流程: basics/workflow.md
    - 工程师职责: basics/responsibilities.md
    - 法规与标准: basics/standards.md
  - 整车参数:
    - 尺寸参数: parameters/dimensions.md
    - 质量参数: parameters/mass.md
    - 性能参数: parameters/performance.md
    - 对标数据库: parameters/benchmark.md
  - IP&CNSL 区域总布置:
    - IP 布置: ip-cnsl/ip.md
    - CNSL 布置: ip-cnsl/cnsl.md
    - 校核标准: ip-cnsl/check.md
  - 门板&立柱&顶棚区域总布置:
    - 门板布置: door-trim/door.md
    - 立柱布置: door-trim/pillar.md
    - 顶棚布置: door-trim/roof.md
    - 校核标准: door-trim/check.md
  - 前后端区域总布置:
    - 前端区域: front-rear/front.md
    - 后端区域: front-rear/rear.md
    - 校核标准: front-rear/check.md
  - 人机舒适性标准:
    - 坐姿与H点: ergonomics/posture.md
    - 操作可达性: ergonomics/reach.md
    - 视野校核: ergonomics/vision.md
    - 空间与进出便利性: ergonomics/comfort.md
  - 整车断面:
    - 断面开发流程: sections/process.md
    - 断面设计方法: sections/method.md
    - 典型断面清单: sections/library.md
  - 整车开发流程:
    - 流程概述: process/overview.md
    - 关键里程碑: process/milestones.md
    - 阶段交付物: process/deliverables.md
  - 工具与资源:
    - 软件工具: tools/software.md
    - 学习资源: tools/learning.md
    - 职业发展: tools/career.md
  - 维护指南:
    - 内容更新: maintain/update.md
    - 部署发布: maintain/deploy.md
    - 本地开发: maintain/develop.md
  - 关于: about.md
